[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coldvault"
dynamic = ["version"]
description = "Build a private Obsidian vault from Claude Code and Codex transcripts, Markdown folders and Notion exports."
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
coldvault = "coldvault:main"

[tool.setuptools]
py-modules = ["coldvault", "vault_kit"]

[tool.setuptools.dynamic]
version = {attr = "coldvault.__version__"}
